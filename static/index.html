<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Billing Console</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <div class="bg"></div>
    <main class="app">
      <header class="top">
        <h1>Billing Console</h1>
        <div class="actions">
          <button id="seedBtn">Загрузить демо-данные</button>
          <button id="refreshBtn" class="ghost">Обновить</button>
        </div>
      </header>

      <div class="crm-layout">
        <aside class="crm-sidebar">
          <h2 class="sidebar-title">Списки</h2>

          <section class="sidebar-block">
            <h3>Контрагенты</h3>
            <div id="contractorList" class="list list-scroll"></div>
          </section>

          <section class="sidebar-block">
            <h3>Системы мониторинга</h3>
            <div id="monitoringList" class="list list-scroll"></div>
          </section>

          <section class="sidebar-block">
            <h3>Клиенты</h3>
            <div class="tableWrap small">
              <table>
                <thead>
                  <tr>
                    <th>ID</th>
                    <th>Клиент</th>
                    <th>Контрагент</th>
                  </tr>
                </thead>
                <tbody id="clientsTable"></tbody>
              </table>
            </div>
          </section>
        </aside>

        <section class="crm-main">
          <section class="cards" id="summary"></section>

          <section class="grid">
            <article class="card">
              <h2>Контрагенты</h2>
              <form id="contractorForm" class="form">
                <input name="name" placeholder="Название" required />
                <select name="customer_type" required>
                  <option value="company">ООО / юрлицо</option>
                  <option value="individual">ИП / физлицо</option>
                </select>
                <input name="external_contractor_id" placeholder="ID в бухгалтерии" required />
                <input name="email" type="email" placeholder="Email" required />
                <input name="accounting_api_key" placeholder="API ключ (опционально)" />
                <button>Добавить</button>
              </form>
            </article>

            <article class="card">
              <h2>Системы мониторинга</h2>
              <form id="monitoringForm" class="form">
                <input name="name" placeholder="Название системы" required />
                <input name="code" placeholder="Код (например navixy)" required />
                <input name="api_base_url" placeholder="API URL" required />
                <input name="admin_api_key" placeholder="Admin API key (опционально)" />
                <button>Добавить</button>
              </form>
            </article>

            <article class="card wide">
              <h2>Клиенты</h2>
              <form id="clientForm" class="form">
                <input name="name" placeholder="Название клиента" required />
                <input name="email" type="email" placeholder="Email" required />
                <select name="contractor_id" id="contractorSelect" required></select>
                <select name="monitoring_system_id" id="monitoringSelect" required title="Система мониторинга клиента"></select>
                <input name="monitoring_account_id" placeholder="User ID / аккаунт" required />
                <input name="monitoring_api_key" placeholder="Client hash (опционально)" />
                <input name="price_per_vehicle" type="number" step="0.01" placeholder="Цена за машину" required />
                <input name="payment_term_days" type="number" placeholder="Срок оплаты (дней)" value="10" />
                <input name="block_after_due_days" type="number" placeholder="Блок через N дней" value="0" />
                <input name="disable_after_day" type="number" placeholder="После дня месяца (напр. 10)" value="10" />
                <button>Добавить клиента</button>
              </form>
            </article>
          </section>

          <section class="card">
            <div class="tableHeader">
              <h2>Реестр документов</h2>
              <div class="filters">
                <input id="monthFilter" placeholder="YYYY-MM" />
                <button id="filterBtn" class="ghost">Фильтр</button>
              </div>
            </div>
            <div class="tableWrap">
              <table>
                <thead>
                  <tr>
                    <th>ID</th>
                    <th>Клиент</th>
                    <th>Контрагент</th>
                    <th>Система</th>
                    <th>Период</th>
                    <th>Сумма</th>
                    <th>Email</th>
                    <th>Оплата</th>
                  </tr>
                </thead>
                <tbody id="docsTable"></tbody>
              </table>
            </div>
          </section>
        </section>
      </div>
    </main>
    <script src="/static/app.js"></script>
  </body>
</html>
